# One replica with Recreate: SQLite on one volume cannot be shared, so
# the old pod must be gone before the new one opens the database. The
# store is migrated at start, so a fresh volume is usable at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-analytics
  labels:
    app.kubernetes.io/name: workshop-analytics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workshop-analytics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/grahamdumpleton/jupyterlab-workshop-analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: sqlite:////data/analytics.db
            - name: TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: workshop-analytics-key
                  key: TOKEN_SIGNING_KEY
            - name: DENIED_TOKENS_FILE
              value: /etc/workshop-analytics/denied/denied.txt
            - name: WRAPTURE_CONFIG
              value: /etc/workshop-analytics/wrapture.toml
            - name: COOKIE_SECURE
              value: "true"
            # Only the ingress controller can reach the pod, so its
            # X-Forwarded-* headers are trusted from any address.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: denied
              mountPath: /etc/workshop-analytics/denied
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workshop-analytics-data
        - name: denied
          configMap:
            name: workshop-analytics-denied
