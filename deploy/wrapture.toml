# Observability for a deployed analytics service.
#
# The container image carries this file at
# /etc/workshop-analytics/wrapture.toml and the Kubernetes Deployment
# points WRAPTURE_CONFIG at it, so the service starts traced; a cluster
# that wants something else mounts its own copy over the path. It is
# the repository's wrapture.toml without the printer sink: the same
# third-party layers, the same call sites, the same log capture, and
# OTLP export of traces, metrics and logs to whatever collector
# OTEL_EXPORTER_OTLP_ENDPOINT names in the environment. The endpoint
# below is the fallback for a cluster that runs the collector beside
# the service under that name; see docs/deploying.md.

capture = "summary"

# Third-party layers: the request boundary with its route, every
# statement as a leaf, the driver beneath it, and the dashboard's
# template renders. Health checks and static files stay out of the
# trace, and a token that arrives as a query parameter is masked over
# and above wrapture's built-in sensitive names.

[[instrument]]
name = "fastapi"
ignore_paths = ["/healthz", "/static/*"]
redact = ["token"]

[[instrument]]
name = "sqlalchemy"

[[instrument]]
name = "sqlite3"

[[instrument]]
name = "jinja2"
loading = false

# The service's own call sites, by module. Adding or dropping a module
# here needs no code change. The batch itself is redacted where it is
# an argument, so event bodies never reach a sink; the counts the
# pipeline annotates say what happened to them.

[[observe]]
target = "workshop_analytics.ingest:Ingest"
match = "*"
redact = ["items"]

# Parsing returns the batch it was given, so its result is captured as
# its shape, the type and the count, never the events; the entry is
# separate because the result capture is per entry.

[[observe]]
target = "workshop_analytics.ingest"
name = ["parse_body"]
redact = ["body"]
capture_result = "shape"

# The projection and the store at the granularity of a batch: the
# per-event helpers beneath these (folding one event, hashing one
# event) would add a span per event and say nothing a batch's span
# does not.

[[observe]]
target = "workshop_analytics.projection"
name = ["apply_events", "project_session", "rebuild"]

# The live view's rows are every session on the page, so the same
# treatment as the batch: the call is seen, the rows are not.

[[observe]]
target = "workshop_analytics.projection"
name = ["live_rows"]
capture_result = "shape"

[[observe]]
target = "workshop_analytics.live:Broadcaster"
match = "*"

# The SQL tool: each statement as a span carrying the statement and
# its parameters, the rows as a shape. The statement is the analyst's
# own text and the data holds no secrets, so neither is redacted.

[[observe]]
target = "workshop_analytics.sql:SqlTool"
name = ["run"]
capture_result = "shape"

# The questions the query API answers, one span per question with the
# filters as its arguments. Their results are whole reports, so they
# are captured as shapes; the helpers beneath them (loading, chaining,
# percentiles) would add spans per session and are left out.

[[observe]]
target = "workshop_analytics.queries"
name = [
  "describe",
  "list_workshops",
  "list_collections",
  "collection_progress",
  "workshop_summary",
  "funnel",
  "page_timings",
  "action_usages",
  "checks",
  "trends",
  "list_sessions",
  "session_detail",
  "session_events",
  "query_events",
  "instance",
  "learners",
]
capture_result = "shape"

[[observe]]
target = "workshop_analytics.store.writes"
name = ["insert_events"]

# Bringing the store up to date at startup, so the migration's
# statements nest under one call rather than each standing as its own
# root.

[[observe]]
target = "workshop_analytics.store"
name = ["migrate"]

# The service's own log lines, correlated with the request they happened in.

[[log]]
name = "workshop_analytics.*"
level = "INFO"

[otel]
service_name = "workshop-analytics"
signals = ["traces", "metrics", "logs"]

[otel.environment]
exporter_otlp_endpoint = "http://otel-collector:4318"
exporter_otlp_protocol = "http/protobuf"
